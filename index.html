<meta name="theme-color" content="#10131a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10131a;
    --panel:#181c26;
    --panel-2:#1e2330;
    --rule:#2a3040;
    --parchment:#e9e3d5;
    --muted:#8f8a79;
    --rubric:#c8453c;
    --gold:#c9a227;
    --display:"Cardo",Georgia,"Times New Roman",serif;
    --body:"Spectral",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:var(--body);
    font-weight:300;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}

  /* ---------- masthead ---------- */
  .mast{padding:26px 0 18px;border-bottom:1px solid var(--rule)}
  .mast-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .mast h1{
    font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;
    letter-spacing:.02em;
  }
  .mast h1 .kjv{color:var(--gold);font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    display:block;font-family:var(--mono);font-weight:500;margin-bottom:9px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{display:block;width:46px;flex:0 0 46px}
  .mark svg{display:block;width:100%;height:auto}
  @media (max-width:860px){.mark{width:38px;flex-basis:38px}}
  .count{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .count b{color:var(--gold);font-weight:500}

  .searchbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .searchbar input{
    flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--rule);
    color:var(--parchment);font-family:var(--body);font-size:16px;padding:11px 14px;border-radius:2px;
  }
  .searchbar input::placeholder{color:#6d6857}
  .searchbar input:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
  .btn{
    background:transparent;border:1px solid var(--rule);color:var(--parchment);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 15px;border-radius:2px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.gold{border-color:var(--gold);color:var(--gold)}
  .btn.gold:hover{background:var(--gold);color:var(--ink)}

  /* ---------- letter rail ---------- */
  .rail{display:flex;flex-wrap:wrap;gap:1px;margin:16px 0 0;padding-bottom:2px}
  .rail button{
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    background:none;border:0;border-bottom:2px solid transparent;
    color:#5f5b4d;padding:5px 7px;cursor:pointer;
  }
  .rail button.has{color:var(--parchment)}
  .rail button.on{color:var(--rubric);border-bottom-color:var(--rubric)}
  .rail button:focus-visible{outline:2px solid var(--gold)}

  /* ---------- layout ---------- */
  .cols{display:grid;grid-template-columns:290px 1fr;gap:34px;margin-top:26px;align-items:start}

  .index{border-right:1px solid var(--rule);padding-right:22px;max-height:74vh;overflow-y:auto}
  .index::-webkit-scrollbar{width:6px}
  .index::-webkit-scrollbar-thumb{background:var(--rule)}
  .idx-item{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(42,48,64,.55);
    color:var(--parchment);font-family:var(--display);font-size:17px;padding:9px 4px;cursor:pointer;
  }
  .idx-item:hover{color:var(--gold)}
  .idx-item.on{color:var(--rubric)}
  .idx-item:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .idx-item .cat{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-top:2px;
  }
  .idx-item .added{color:var(--gold)}
  .idx-empty{color:var(--muted);font-size:14.5px;padding:14px 2px}

  /* ---------- entry ---------- */
  .entry{min-height:340px}
  .entry-head{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:22px}
  .entry-head h2{
    font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;margin:0 0 8px;
    letter-spacing:.01em;
  }
  .tagline{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
    background:var(--gold);padding:3px 8px;border-radius:1px}
  .tag.mine{background:transparent;color:var(--gold);border:1px solid var(--gold)}

  .orig{
    font-family:var(--display);font-size:18px;font-style:italic;color:var(--gold);
    margin:0 0 22px;line-height:1.5;
  }

  /* signature: marginal rubric references */
  .body-grid{display:grid;grid-template-columns:1fr 190px;gap:30px;align-items:start}
  .prose p{margin:0 0 18px;font-size:17.5px}
  .sec-label{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--rule);
  }
  .note{font-size:16.5px;color:#cfc8b7;border-left:2px solid var(--rubric);padding-left:16px;margin:0}

  .margin{border-left:1px solid var(--rule);padding-left:16px;position:sticky;top:16px}

  /* ---------- states ---------- */
  .placeholder{color:var(--muted);font-size:17px;max-width:46ch;padding-top:8px}

  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .back{display:none}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- mobile ---------- */
  @media (max-width:860px){

  .root{border-top:1px dashed var(--rule);padding:10px 0}

  .pron{color:var(--muted)}.outline{margin:.3em 0 .3em 1.2em;padding:0;font-size:14px}
  .article{font-size:15px}.article p{margin:.5em 0}
  a.vr{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
  .vpop{display:block;margin:6px 0 8px;padding:8px 12px;background:var(--ink);border-left:2px solid var(--gold);font-style:italic}
  .vlist{list-style:none;padding:0;margin:0}.vlist li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:15px}

  mark{background:rgba(201,162,39,.25);color:inherit;padding:0 2px;border-radius:2px}
  .notes textarea{width:100%;min-height:110px;background:var(--panel);color:var(--parchment);border:1px solid var(--rule);border-radius:6px;padding:10px;font:inherit;font-size:15px}
  .chip.sn{font-family:var(--mono);font-size:12px}
  @media (pointer:coarse){
    .btn,.rail button,.chip{min-height:44px;min-width:44px}

    .rail{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px}
    #q{font-size:18px;min-height:48px}
    .deep summary{padding:12px 0}
    a.vr{padding:4px 0}
  }

  .word-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:80;
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .modal-backdrop[hidden]{display:none!important}
  .modal{
    background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--gold);
    border-radius:4px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px 22px 18px;
    box-shadow:0 18px 48px rgba(0,0,0,.45);
  }
  .modal h3{font-family:var(--display);font-size:24px;margin:0 0 6px;font-weight:700}
  .modal .hint{color:var(--muted);font-size:14px;margin:0 0 16px}
  .modal label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
  .modal input,.modal textarea{
    width:100%;background:var(--ink);border:1px solid var(--rule);color:var(--parchment);
    font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:2px;
  }
  .modal textarea{min-height:110px;resize:vertical}
  .modal input:focus,.modal textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .modal-actions .spacer{flex:1}
  .modal .err{min-height:1.2em;margin-top:8px}
  .modal-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
